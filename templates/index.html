<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>samAI - Intelligent Learning Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            backdrop-filter: blur(10px);
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: slideDown 0.6s ease;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header h1 {
            color: #667eea;
            font-size: 3em;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: -1px;
        }
        
        .header p {
            color: #888;
            font-size: 1.1em;
            font-weight: 300;
        }
        
        .section {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        .section.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.98);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .input-group {
            margin-bottom: 20px;
        }

        .helper-text {
            margin-top: 8px;
            color: #666;
            font-size: 0.92em;
            line-height: 1.5;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 1em;
        }
        
        input, select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1em;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            background: #f8f9fa;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(-1px);
        }
        
        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .subject-card {
            padding: 25px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }
        
        .subject-card:hover {
            border-color: #667eea;
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.2);
        }
        
        .subject-card.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }
        
        .subject-icon {
            font-size: 3em;
            margin-bottom: 12px;
        }
        
        .subject-name {
            font-weight: 600;
            font-size: 1.05em;
        }
        
        .level-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .level-btn {
            padding: 14px;
            border: 2px solid #e0e0e0;
            background: white;
            color: #333;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95em;
        }
        
        .level-btn:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.1);
        }
        
        .level-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }
        
        .question-container {
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f4ff 100%);
            padding: 35px;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 2px solid #e8ecff;
        }
        
        .question-counter {
            color: #667eea;
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .question-text {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
            line-height: 1.6;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .option {
            padding: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .option:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateX(5px);
        }
        
        .option input[type="radio"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }
        
        .option label {
            flex: 1;
            margin: 0;
            cursor: pointer;
            font-weight: 500;
        }
        
        .feedback {
            padding: 20px;
            border-radius: 12px;
            margin-top: 25px;
            display: none;
            font-weight: 600;
            animation: slideUp 0.4s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .feedback.correct {
            display: block;
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            color: #155724;
            border: 2px solid #28a745;
        }
        
        .feedback.incorrect {
            display: block;
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        
        .score-board {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            animation: slideDown 0.6s ease;
        }
        
        .score-info {
            font-size: 1.1em;
            margin-bottom: 15px;
            opacity: 0.9;
            font-weight: 500;
        }
        
        .score-display {
            font-size: 2.8em;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        
        .message {
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
            animation: slideDown 0.4s ease;
        }
        
        .message.error {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        
        .message.success {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            color: #155724;
            border: 2px solid #28a745;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-container {
            text-align: center;
            padding: 40px;
            margin: 20px 0;
        }
        
        .loading-text {
            margin-top: 15px;
            color: #667eea;
            font-weight: 600;
            font-size: 1.05em;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }
        
        .button-group button {
            flex: 1;
        }
        
        .back-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .logout-btn {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }
        
        .question-complete {
            text-align: center;
            padding: 40px 20px;
        }
        
        .complete-icon {
            font-size: 4em;
            margin-bottom: 20px;
            animation: bounce 0.6s ease;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        .complete-text {
            color: #333;
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 20px;
        }
        
        .score-percentage {
            font-size: 2.5em;
            color: #667eea;
            font-weight: 700;
            margin: 20px 0;
        }
        
        .timer-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 15px;
            background: white;
            border-radius: 12px;
            border: 2px solid #e8ecff;
        }
        
        .timer-display {
            font-size: 1.3em;
            font-weight: 700;
            color: #667eea;
        }
        
        .timer-display.warning {
            color: #f5576c;
            animation: pulse 0.6s ease infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        .question-progress {
            font-size: 0.95em;
            color: #888;
            font-weight: 600;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .subjects-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .question-text {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 samAI</h1>
            <p>Master Skills with AI-Powered Learning</p>
        </div>
        
        <!-- Auth Section -->
        <div id="authSection" class="section active">
            <div id="authMessage"></div>
            
            <div class="input-group">
                <label>Enter Your Name</label>
                <input type="text" id="username" placeholder="John Doe" onkeypress="handleKeyPress(event, 'register')">
            </div>
            
            <button onclick="registerUser()">Start Learning</button>
        </div>
        
        <!-- Subject Selection Section -->
        <div id="subjectSection" class="section">
            <h2 style="margin-bottom: 20px; color: #333; font-size: 1.5em;">📚 Choose Your Subject</h2>
            <div id="message"></div>
            
            <div id="subjectsContainer" class="subjects-grid"></div>

            <div class="input-group" style="margin-top: 30px;">
                <label for="customTopic">Or Enter Your Own Topic</label>
                <input type="text" id="customTopic" placeholder="Example: HFT style Linux interview questions" oninput="handleCustomTopicInput()">
                <div class="helper-text">Type any custom topic and samAI will generate a quiz around it.</div>
            </div>

            <button onclick="useCustomTopic()" style="margin-bottom: 15px;">Continue With Custom Topic</button>
            
            <button onclick="logout()" class="logout-btn">Logout</button>
        </div>
        
        <!-- Level Selection Section -->
        <div id="levelSection" class="section">
            <h2 style="margin-bottom: 25px; color: #333; font-size: 1.5em;">🎯 Select Difficulty Level</h2>
            
            <div class="level-selector">
                <button class="level-btn active" onclick="selectLevel('easy')">🌱 Easy</button>
                <button class="level-btn" onclick="selectLevel('medium')">⚡ Medium</button>
                <button class="level-btn" onclick="selectLevel('pro')">🔥 Pro</button>
            </div>
            
            <div class="input-group">
                <label for="questionCount">Number of Questions</label>
                <input type="number" id="questionCount" min="1" max="25" value="15">
                <div class="helper-text">Pick between 1 and 25 questions. Default is 15.</div>
            </div>

            <button onclick="startQuiz()">Begin Quiz</button>
            <div class="button-group" style="margin-top: 15px;">
                <button onclick="goBackToSubjects()" class="back-btn">Back</button>
                <button onclick="logout()" class="logout-btn">Logout</button>
            </div>
        </div>
        
        <!-- Quiz Section -->
        <div id="quizSection" class="section">
            <div class="score-board">
                <div class="score-info" id="userDisplay"></div>
                <div class="score-display" id="scoreDisplay">0</div>
            </div>
            
            <div id="loadingContainer" class="loading-container" style="display: none;">
                <div class="loading-spinner"></div>
                <div class="loading-text">Generating your questions...</div>
            </div>
            
            <div id="questionContainer" class="question-container"></div>
            <div id="feedbackContainer" class="feedback"></div>
            
            <div class="button-group">
                <button onclick="goBackToSubjects()" class="back-btn">Back</button>
                <button onclick="logout()" class="logout-btn">Logout</button>
            </div>
        </div>
    </div>
    
    <script>
        let currentUser = null;
        let currentSubject = null;
        let currentTopicLabel = null;
        let currentLevel = 'easy';
        let currentQuestion = null;
        let currentQuestionIndex = 0;
        let questions = [];
        let quizScore = 0;
        let subjects = [];
        let questionTimer = null;
        let timeRemaining = 0;
        let quizStartTime = null;
        let quizDurationSeconds = 0;
        const TIME_PER_QUESTION = 90; // 90 seconds per question

        function formatDuration(totalSeconds) {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${minutes}m ${seconds}s`;
        }

        function formatTopicLabel(topicLabel, isCustom = false) {
            if (!topicLabel) {
                return '';
            }
            return isCustom ? `Custom Topic - ${topicLabel}` : topicLabel.replace('_', ' ');
        }

        function getCompletionMessage(percentage) {
            if (percentage >= 80) {
                return 'Good job! You really know your stuff.';
            }
            if (percentage >= 60) {
                return 'Nice work. You are getting there.';
            }
            return 'Good effort. One more round will make this even stronger.';
        }
        
        function handleKeyPress(event, action) {
            if (event.key === 'Enter') {
                if (action === 'register') registerUser();
            }
        }
        
        async function registerUser() {
            const username = document.getElementById('username').value.trim();
            
            if (!username) {
                showAuthMessage('Please enter your name', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    currentUser = username;
                    showSubjectSelection();
                    loadSubjects();
                }
            } catch (error) {
                showAuthMessage('Error: ' + error.message, 'error');
            }
        }
        
        async function loadSubjects() {
            try {
                const response = await fetch('/api/subjects');
                const data = await response.json();
                subjects = data.subjects;
                const subjectInfo = data.subjectInfo;
                displaySubjects(subjectInfo);
            } catch (error) {
                console.error('Error loading subjects:', error);
            }
        }
        
        function displaySubjects(subjectInfo) {
            const container = document.getElementById('subjectsContainer');
            container.innerHTML = '';
            
            subjects.forEach(subject => {
                const info = subjectInfo[subject];
                const card = document.createElement('div');
                card.className = 'subject-card';
                card.dataset.subject = subject;
                card.innerHTML = `
                    <div class="subject-icon">${info.icon}</div>
                    <div class="subject-name">${info.name}</div>
                `;
                card.onclick = () => selectSubject(subject);
                container.appendChild(card);
            });
        }
        
        function selectSubject(subject) {
            currentSubject = subject;
            currentTopicLabel = formatTopicLabel(subject);
            document.getElementById('customTopic').value = '';
            updateSelectedSubjectCard();
            showLevelSelection();
        }

        function handleCustomTopicInput() {
            const customTopic = document.getElementById('customTopic').value.trim();
            if (customTopic) {
                currentSubject = null;
                currentTopicLabel = formatTopicLabel(customTopic, true);
            }
            updateSelectedSubjectCard();
        }

        function updateSelectedSubjectCard() {
            document.querySelectorAll('.subject-card').forEach(card => card.classList.remove('selected'));

            if (!currentSubject) {
                return;
            }

            const selectedCard = document.querySelector(`[data-subject="${currentSubject}"]`);
            if (selectedCard) {
                selectedCard.classList.add('selected');
            }
        }

        function useCustomTopic() {
            const customTopic = document.getElementById('customTopic').value.trim();
            if (!customTopic) {
                showMessage('Type a custom topic first', 'error');
                return;
            }

            currentSubject = null;
            currentTopicLabel = formatTopicLabel(customTopic, true);
            updateSelectedSubjectCard();
            showLevelSelection();
        }
        
        function showAuthSection() {
            hideAllSections();
            document.getElementById('authSection').classList.add('active');
        }
        
        function showSubjectSelection() {
            hideAllSections();
            document.getElementById('subjectSection').classList.add('active');
        }
        
        function showLevelSelection() {
            hideAllSections();
            document.getElementById('levelSection').classList.add('active');
        }
        
        function showQuizSection() {
            hideAllSections();
            document.getElementById('quizSection').classList.add('active');
        }
        
        function hideAllSections() {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        }
        
        function selectLevel(level) {
            currentLevel = level;
            document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }
        
        async function startQuiz() {
            const customTopic = document.getElementById('customTopic').value.trim();
            const countInput = parseInt(document.getElementById('questionCount').value, 10);
            const questionCount = Number.isFinite(countInput) ? Math.min(Math.max(countInput, 1), 25) : 15;
            const selectedTopic = customTopic || currentSubject;

            if (!selectedTopic) {
                showSubjectSelection();
                showMessage('Select a subject or type a custom topic first', 'error');
                return;
            }

            currentTopicLabel = customTopic
                ? formatTopicLabel(customTopic, true)
                : formatTopicLabel(currentSubject);
            showQuizSection();
            document.getElementById('loadingContainer').style.display = 'block';
            document.getElementById('questionContainer').innerHTML = '';
            clearFeedback();
            showMessage('', 'success');
            
            try {
                const params = new URLSearchParams({
                    level: currentLevel,
                    count: String(questionCount)
                });

                if (customTopic) {
                    params.set('custom_topic', customTopic);
                } else {
                    params.set('subject', currentSubject);
                }

                const response = await fetch(`/api/questions?${params.toString()}`);
                const data = await response.json();
                document.getElementById('loadingContainer').style.display = 'none';
                
                if (!response.ok) {
                    showMessage(data.error || 'Failed to load questions', 'error');
                    return;
                }

                if (!Array.isArray(data) || data.length === 0) {
                    showMessage('No questions available', 'error');
                    return;
                }

                questions = data;
                
                quizScore = 0;
                currentQuestionIndex = 0;
                quizStartTime = Date.now();
                quizDurationSeconds = 0;
                
                setTimeout(() => {
                    displayQuestion();
                }, 1500);
                
            } catch (error) {
                document.getElementById('loadingContainer').style.display = 'none';
                showMessage('Error: ' + error.message, 'error');
            }
        }
        
        function displayQuestion() {
            if (currentQuestionIndex >= questions.length) {
                const percentage = Math.round((quizScore / questions.length) * 100);
                const completionMessage = getCompletionMessage(percentage);
                quizDurationSeconds = quizStartTime
                    ? Math.max(0, Math.round((Date.now() - quizStartTime) / 1000))
                    : 0;
                document.getElementById('questionContainer').innerHTML = `
                    <div class="question-complete">
                        <div class="complete-icon">🎉</div>
                        <div class="complete-text">Quiz Complete!</div>
                        <div style="font-size: 1.1em; color: #555; margin-bottom: 16px;">${completionMessage}</div>
                        <div style="font-size: 1.2em; color: #666; margin-bottom: 20px;">You scored:</div>
                        <div class="score-percentage">${quizScore}/${questions.length}</div>
                        <div style="font-size: 1.3em; color: #667eea; font-weight: 700; margin-bottom: 12px;">${percentage}%</div>
                        <div style="font-size: 1.05em; color: #666;">Time taken: ${formatDuration(quizDurationSeconds)}</div>
                    </div>
                `;
                document.getElementById('scoreDisplay').textContent = `${quizScore}/${questions.length}`;
                if (questionTimer) clearInterval(questionTimer);
                return;
            }

            if (!Array.isArray(questions) || !questions[currentQuestionIndex]) {
                document.getElementById('questionContainer').innerHTML = '';
                showMessage('Questions could not be loaded. Check the API configuration and try again.', 'error');
                return;
            }
            
            currentQuestion = questions[currentQuestionIndex];
            let optionsHtml = '';
            
            currentQuestion.options.forEach((option, index) => {
                optionsHtml += `
                    <div class="option">
                        <input type="radio" name="answer" value="${index}" id="opt${index}">
                        <label for="opt${index}">${option}</label>
                    </div>
                `;
            });
            
            document.getElementById('scoreDisplay').textContent = quizScore;
            document.getElementById('userDisplay').textContent = `${currentUser} • ${currentTopicLabel.toUpperCase()} • ${currentLevel.toUpperCase()}`;
            
            document.getElementById('questionContainer').innerHTML = `
                <div class="timer-section">
                    <div class="question-progress">Question ${currentQuestionIndex + 1} of ${questions.length}</div>
                    <div class="timer-display" id="timerDisplay">
                        ⏱️ <span id="timerValue">${TIME_PER_QUESTION}</span>s
                    </div>
                </div>
                <div class="question-text">${currentQuestion.question}</div>
                <div class="options">
                    ${optionsHtml}
                </div>
                <button id="submitAnswerBtn" onclick="submitAnswer()" style="margin-top: 25px;">Submit Answer</button>
            `;
            
            clearFeedback();
            
            // Start timer
            if (questionTimer) clearInterval(questionTimer);
            timeRemaining = TIME_PER_QUESTION;
            startTimer();
        }
        
        function startTimer() {
            questionTimer = setInterval(() => {
                timeRemaining--;
                document.getElementById('timerValue').textContent = timeRemaining;
                
                const timerDisplay = document.getElementById('timerDisplay');
                if (timeRemaining <= 10) {
                    timerDisplay.classList.add('warning');
                } else {
                    timerDisplay.classList.remove('warning');
                }
                
                // Auto-submit when time runs out
                if (timeRemaining <= 0) {
                    clearInterval(questionTimer);
                    const selected = document.querySelector('input[name="answer"]:checked');
                    if (selected) {
                        submitAnswer();
                    } else {
                        // Auto-select first option if no selection
                        document.querySelector('input[name="answer"]').checked = true;
                        submitAnswer();
                    }
                }
            }, 1000);
        }
        
        async function submitAnswer() {
            const selected = document.querySelector('input[name="answer"]:checked');
            
            if (!selected) {
                showMessage('Please select an answer', 'error');
                return;
            }
            
            if (questionTimer) clearInterval(questionTimer);
            document.querySelectorAll('input[name="answer"]').forEach(input => input.disabled = true);
            const submitButton = document.getElementById('submitAnswerBtn');
            if (submitButton) {
                submitButton.disabled = true;
                submitButton.style.opacity = '0.7';
                submitButton.style.cursor = 'not-allowed';
            }
            
            const userAnswer = parseInt(selected.value);
            
            try {
                const response = await fetch('/api/submit-answer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: currentUser,
                        question_id: currentQuestion.id,
                        answer: userAnswer,
                        level: currentLevel,
                        subject: currentTopicLabel,
                        correct_answer: currentQuestion.correct
                    })
                });
                
                const data = await response.json();
                
                const feedbackDiv = document.getElementById('feedbackContainer');
                if (data.correct) {
                    quizScore++;
                    feedbackDiv.className = 'feedback correct';
                    feedbackDiv.innerHTML = `<strong>✅ Correct!</strong><br><br>${data.correct_answer !== undefined ? currentQuestion.options[data.correct_answer] : ''}<br><br>${currentQuestion.explanation}`;
                } else {
                    feedbackDiv.className = 'feedback incorrect';
                    feedbackDiv.innerHTML = `<strong>❌ Incorrect</strong><br><br>Correct Answer: ${currentQuestion.options[data.correct_answer]}<br><br>${currentQuestion.explanation}`;
                }
                
                const nextButtonLabel = currentQuestionIndex === questions.length - 1 ? 'See Results' : 'Next Question';
                feedbackDiv.innerHTML += `<div style="margin-top: 20px;"><button onclick="nextQuestion()">${nextButtonLabel}</button></div>`;
                
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }
        
        function clearFeedback() {
            document.getElementById('feedbackContainer').className = 'feedback';
            document.getElementById('feedbackContainer').innerHTML = '';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            displayQuestion();
        }
        
        function goBackToSubjects() {
            showSubjectSelection();
        }
        
        function logout() {
            currentUser = null;
            currentSubject = null;
            currentTopicLabel = null;
            quizStartTime = null;
            quizDurationSeconds = 0;
            document.getElementById('username').value = '';
            document.getElementById('customTopic').value = '';
            document.getElementById('questionCount').value = 15;
            document.getElementById('authMessage').innerHTML = '';
            updateSelectedSubjectCard();
            showAuthSection();
        }
        
        function showAuthMessage(text, type) {
            const messageDiv = document.getElementById('authMessage');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
        }
        
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            if (!text) {
                messageDiv.className = '';
                messageDiv.textContent = '';
                return;
            }
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
        }
    </script>
</body>
</html>
