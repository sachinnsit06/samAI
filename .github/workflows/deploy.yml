name: Docker Build and Deploy
on:
  push:
    branches: [ "samAI", "main", "master" ] # Trigger on push to main or master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Google Auth
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Configure Docker for GCP
      run: gcloud auth configure-docker --quiet

    - name: Build and Push Docker Image
      run: |
        docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/sam-ai-app:latest .
        docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/sam-ai-app:latest

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy sam-ai-service \
          --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/sam-ai-app:latest \
          --region us-central1 \
          --platform managed \
          --allow-unauthenticated

